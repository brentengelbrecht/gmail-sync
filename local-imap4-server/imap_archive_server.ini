# imap_archive_server.ini
#
# Configuration for imap_archive_server.py. Keep this file in the same folder
# as the script (or pass --config /other/path.ini).
#
# Format notes:
#   * Lines starting with # or ; are comments. Put comments on their own lines,
#     not after a value (an inline "#" would become part of the value).
#   * Lines that set an option must start in column 1. An indented line is
#     treated as a continuation of the previous option's value.
#   * Relative paths are resolved relative to THIS file's folder; "~" is expanded.
#   * Unknown sections or option names are rejected at startup, so typos
#     are caught rather than silently ignored.
#   * Every option below is shown with its default. Options marked REQUIRED
#     have no default. You can delete any option you are happy to leave at the
#     default.
#
# Layout of this file:
#   [server] [tls] [auth] [logging]   settings shared by all accounts
#   [account:LOGIN] ...               one section per mailbox repository


# ---------------------------------------------------------------------------
[server]
# ---------------------------------------------------------------------------

# Address to listen on. 0.0.0.0 = all IPv4 interfaces (default), "::" = all
# IPv6 (and usually IPv4 too), 127.0.0.1 = this machine only.
host = 0.0.0.0

# TCP port. Default 1143, which a normal user may bind. The standard ports are
# 143 (plain/STARTTLS) and 993 (implicit TLS); binding those needs root or:
#   sudo setcap 'cap_net_bind_service=+ep' $(readlink -f $(which python3))
# (that grants it to every Python script, so prefer a high port or a
# firewall/NAT redirect, e.g. 993 -> 1993, instead).
port = 1143

# Only accept connections from these networks (CIDR notation, separated by
# commas). Anything else is closed immediately. Default: empty = no
# restriction (rely on your firewall). Typical home LAN example:
#   allow_networks = 192.168.0.0/16, 10.0.0.0/8, 127.0.0.1/32
allow_networks =

# How many recently opened messages to keep parsed in memory per client
# connection (1 to 10000). Clients often make several requests for the same
# message (headers, structure, body). Raise it for faster browsing, lower it
# if memory on the Pi is tight. Default 16.
cache_messages = 16

# true/false. When true (default), every message file is checked against its
# recorded size and SHA-256 the first time a client opens it; a mismatch is
# logged as an ERROR ("INTEGRITY MISMATCH ...") but the message is still
# served, so you can inspect damaged mail. Set false to skip the hash on slow
# storage; --verify still checks everything.
verify_on_read = true

# Seconds a new connection may take to log in (1 to 86400; 0 = no limit).
# This is one overall deadline from the moment the client connects, so a client
# that connects and does nothing, or trickles commands without logging in,
# cannot hold a connection open. Default 120.
login_timeout = 120

# Seconds a logged-in client may stay silent before the server says
# "* BYE Autologout" and closes the connection (1 to 86400; 0 = no limit).
# Every command resets the timer. RFC 3501 asks for at least 30 minutes
# (1800), which is the default. Mail clients reconnect on their own.
idle_timeout = 1800

# The most simultaneous client connections (1 to 100000; 0 = no limit).
# Connections beyond this get "* BYE Too many connections". Thunderbird opens
# a handful per account, so the default is generous for a home network. Default 100.
max_connections = 100


# ---------------------------------------------------------------------------
[tls]
# ---------------------------------------------------------------------------
# Leave both empty (default) for plain, unencrypted IMAP. Setting cert turns on
# implicit TLS (like port 993): clients must be configured for "SSL/TLS", not
# "STARTTLS". Self-signed is fine on a LAN, e.g.:
#   openssl req -x509 -newkey rsa:3072 -nodes -days 3650 \
#     -keyout imap.key -out imap.crt -subj "/CN=pi.local" \
#     -addext "subjectAltName=DNS:pi.local,IP:192.168.1.50"

# Path to the certificate (PEM). Default: empty (no TLS).
cert =

# Path to the private key (PEM). Default: empty. May be left empty if the key
# is in the same file as the certificate. Keep it chmod 600.
key =


# ---------------------------------------------------------------------------
[auth]
# ---------------------------------------------------------------------------
# Passwords are never stored in this file. They live, salted and hashed
# (scrypt), in a separate password file that you manage with:
#
#   ./imap_archive_server.py --set-password LOGIN
#
# which prompts for the password twice and adds or updates that account's line.
# The server must be restarted to pick up changes.

# Path to the password file (one "login:hash" line per account; created by
# --set-password with mode 600). Default: imap_archive_server.passwd in the
# same folder as this file.
password_file = imap_archive_server.passwd

# Failed-login throttling, per client IP address. When one address makes
# login_fail_limit failed logins within login_fail_window seconds, it is
# blocked for login_block_seconds: new connections from it are answered with
# "* BYE Too many failed logins" straight away, and no password is checked
# (so a guessing run costs the server nothing). A successful login clears that
# address's count. There is no per-account lockout, so nobody can lock the real
# user out by guessing at the account name. The counts live in memory only (a
# restart clears them) and at most 10000 addresses are remembered.
# Many users behind one NAT address share one count.
#
# login_fail_limit      Failed logins that trigger a block (0 to 1000).
#                       0 switches throttling off. Default 5.
# login_fail_window     Seconds over which failures are counted (1 to 86400).
#                       Default 300.
# login_block_seconds   How long a blocked address stays blocked (1 to 604800).
#                       Default 600.
# no_throttle_networks  Comma-separated CIDR ranges that are never throttled,
#                       e.g. your home network: 192.168.1.0/24, 127.0.0.1/32.
#                       Default: empty (everybody is throttled).
login_fail_limit = 5
login_fail_window = 300
login_block_seconds = 600
no_throttle_networks =


# ---------------------------------------------------------------------------
[logging]
# ---------------------------------------------------------------------------

# DEBUG, INFO, WARNING or ERROR. Default INFO (connections, logins, startup
# summary, integrity errors). The -v command-line flag forces DEBUG.
level = INFO

# Write the log to this file instead of the terminal. Default: empty (stderr,
# which systemd/journald captures if you run it as a service).
file =

# Seconds between "stats:" log lines (0 to 86400). Each line has the counters
# since the server started: connections (total, open, refused by reason), logins
# (ok, failed, throttled), commands by name, slow commands, bytes sent and
# errors. Use it to see what your clients actually send. 0 = no periodic line
# (default); 3600 is a reasonable value. Independently of this setting,
# `kill -USR1 <pid>` writes the same line at once and a final one is written at
# shutdown whenever stats_interval is above 0. The line never contains command
# arguments, folder names, account names or message content.
stats_interval = 0

# A WARNING "slow command: <tag> <command> took N s (account X, peer Y)" is
# logged for every command that takes longer than this many seconds, counting
# the time spent sending the reply (so a slow client counts too). Decimal values
# are fine (0.5). 0 = never. Default 5. Only the tag and the command name are
# logged, never the arguments.
slow_command_seconds = 5


# ===========================================================================
# ACCOUNTS
# ===========================================================================
# One [account:LOGIN] section per mailbox repository. LOGIN is the username
# the mail client uses to sign in (case-insensitive; no spaces or colons; it
# does not have to be the real email address). A session only ever sees the
# repository of the account it signed in to.
#
# After adding an account, set its password:
#   ./imap_archive_server.py --set-password LOGIN
# The server refuses to start if any account has no password.
#
# Options (all per account):
#
#   path           REQUIRED. The mailbox repository directory, i.e. the folder
#                  that contains repository.json, repository.db and messages/.
#                  With the importer's DB_LOCATION=$HOME/mail-data this is the
#                  URL-encoded mailbox folder, e.g.
#                  /home/pi/mail-data/you%40yourdomain.com
#                  Works for repositories made by gmail_local_repository_api.py
#                  and by imap_local_repository.py; they can be mixed.
#
#   uidvalidity    Default: auto.  IMAP UIDVALIDITY presented to clients.
#                  Clients cache messages by (UIDVALIDITY, UID); if it changes
#                  they discard their cache and re-download, which is how a
#                  server signals "UIDs were renumbered".
#                    auto    derive it from "created_at" in repository.json:
#                            stable for the life of the repository and
#                            different for each repository (recommended).
#                    number  a fixed value from 1 to 4294967295. Increase it
#                            manually if you ever reuse a message_id (for
#                            example after the importer's
#                            delete_local_message() removes the newest message
#                            and a later import takes its place).
#
#   hide_folders   Default: empty (show everything). Folder-name patterns to
#                  hide from this account's clients, separated by commas or
#                  placed one per line (indent continuation lines). Wildcards:
#                  * ? [seq]. Case-sensitive, matched against the full folder
#                  name as stored in the `folders` table. Hidden folders do not
#                  appear in LIST and cannot be selected; --verify still checks
#                  their files. Example for Gmail system labels:
#                    hide_folders = CATEGORY_*, UNREAD, CHAT
#                  Because [seq] is a wildcard, write a literal "[" as "[[]":
#                    hide_folders = [[]Gmail]/All Mail

[account:me]
path = /home/pi/mail-data/you%40yourdomain.com
uidvalidity = auto
hide_folders =

# Example of a second account (remove the leading "# " to enable):
#
# [account:work]
# path = /home/pi/mail-data/work%40example.org
